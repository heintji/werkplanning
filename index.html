<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Werkplanning</title>
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Werkplanning">
<style>
  :root{--bg:#eef1f7;--card:#fff;--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;
    --indigo:#4f46e5;--red:#ef4444;--amber:#f59e0b;--yellow:#eab308;--green:#22c55e;
    --shadow:0 1px 3px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 70px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;background:linear-gradient(120deg,#312e81,#4f46e5 55%,#6366f1);color:#fff;border-radius:18px;padding:20px 26px;box-shadow:var(--shadow);margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:14px}.logo{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:24px}
  header h1{font-size:21px;font-weight:700;letter-spacing:-.3px}header .sub{font-size:13px;opacity:.85;margin-top:2px}
  .today{text-align:right;font-size:13px;opacity:.9}.today b{display:block;font-size:16px}
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:20px}
  .kpi{background:var(--card);border-radius:14px;padding:15px 16px 13px;box-shadow:var(--shadow);border:1px solid var(--line);cursor:pointer;transition:.12s}
  .kpi:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(15,23,42,.10)}
  .kpi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;margin-bottom:9px}
  .kpi .n{font-size:27px;font-weight:800;letter-spacing:-1px;line-height:1}.kpi .l{font-size:11.5px;color:var(--muted);margin-top:5px;font-weight:500}
  .kpi.accent .n{color:var(--indigo)}
  .grid{display:grid;grid-template-columns:1fr 1.05fr 1fr;gap:16px;margin-bottom:20px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:14px;font-weight:700}
  .bar-row{display:flex;align-items:center;gap:10px;margin:11px 0}.bar-row .lab{width:90px;font-size:13px;font-weight:600}
  .bar-track{flex:1;height:10px;background:#eef2f7;border-radius:6px;overflow:hidden}.bar-fill{height:100%;border-radius:6px}.bar-row .val{width:22px;text-align:right;font-size:13px;font-weight:700;color:var(--muted)}
  .donut-wrap{display:flex;align-items:center;gap:18px}.donut{position:relative;width:120px;height:120px;flex:0 0 auto}
  .donut .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}.donut .center b{font-size:24px;font-weight:800}.donut .center span{font-size:10px;color:var(--muted)}
  .leg{font-size:12.5px}.leg div{display:flex;align-items:center;gap:8px;margin:6px 0}.dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
  .formcard{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
  .formhead{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;cursor:pointer;background:#f8fafc;border-bottom:1px solid var(--line)}
  .formhead h2{font-size:14px;font-weight:700}.formhead .hint{font-size:12px;color:var(--muted)}
  .formbody{padding:18px 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .fld{display:flex;flex-direction:column;gap:5px}.fld.wide{grid-column:span 2}
  .fld label{font-size:11.5px;font-weight:600;color:var(--muted)}.fld label .req{color:var(--red)}
  .fld input,.fld select{padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink)}
  .fld input:focus,.fld select:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
  .formactions{grid-column:1/-1;display:flex;gap:10px;align-items:center;margin-top:4px}
  .btn{border:none;border-radius:9px;padding:10px 18px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn-primary{background:var(--indigo);color:#fff}.btn-primary:hover{filter:brightness(1.08)}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--muted)}.btn-ghost:hover{color:var(--ink)}
  .deadinfo{font-size:12px;color:var(--muted);margin-left:auto;text-align:right}
  /* tabs */
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tab{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 16px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:8px}
  .tab:hover{color:var(--ink)}.tab.active{background:var(--indigo);border-color:var(--indigo);color:#fff}
  .tab .pill{background:rgba(0,0,0,.08);border-radius:20px;padding:1px 9px;font-size:11.5px}.tab.active .pill{background:rgba(255,255,255,.22)}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:20px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
  .chip:hover{border-color:var(--indigo);color:var(--indigo)}.chip.active{background:var(--indigo);border-color:var(--indigo);color:#fff}
  .search{border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:13px;font-family:inherit;width:190px}
  .search:focus{outline:none;border-color:var(--indigo)}
  .tools{display:flex;gap:8px}.count{color:var(--muted);font-size:12.5px;align-self:center}
  table{width:100%;border-collapse:collapse;background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:12px 13px;background:#f8fafc;border-bottom:1px solid var(--line);font-weight:700}
  tbody td{padding:12px 13px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}tbody tr:hover{background:#f8faff}
  tr.done td{opacity:.72}tr.done .pd{text-decoration:line-through;text-decoration-color:#cbd5e1}
  .pd{font-weight:700}.muted{color:var(--muted);font-size:11.5px}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
  .b-up{background:#e0e7ff;color:#3730a3}.b-go{background:#fef3c7;color:#92400e}.b-do{background:#dcfce7;color:#166534}
  .urg{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12px}.days{font-weight:800;font-variant-numeric:tabular-nums}
  .st{background:#f1f5f9;color:#475569;border:1px solid var(--line)}.st-done{background:#dcfce7;color:#166534}
  .act{display:flex;gap:6px}.iconbtn{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:14px}
  .iconbtn:hover{border-color:var(--indigo)}.iconbtn.go{color:#166534}.empty{text-align:center;color:var(--muted);padding:30px;font-size:14px}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}
  @media(max-width:980px){.kpis{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.formbody{grid-template-columns:repeat(2,1fr)}}
  @media print{.formcard,.tools,.act,.chips,.tabs,.search{display:none}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo">⚡</div><div><h1>Werkplanning</h1><div class="sub">Netbeheer · planning &amp; deadlines</div></div></div>
    <div class="today"><span>Vandaag</span><b id="today"></b></div>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="panel"><h2>Per type werkplan <span style="color:#cbd5e1">· actief</span></h2><div id="byType"></div></div>
    <div class="panel"><h2>Urgentie · actieve klussen</h2>
      <div class="donut-wrap"><div class="donut"><svg width="120" height="120" viewBox="0 0 42 42" id="donut"></svg><div class="center"><div><b id="donutTot">0</b><span>actief</span></div></div></div><div class="leg" id="legend"></div></div>
    </div>
    <div class="panel"><h2>Per status</h2><div id="byStatus"></div></div>
  </div>

  <div class="formcard">
    <div class="formhead" onclick="toggleForm()"><div><h2 id="formTitle">➕ Nieuwe klus toevoegen</h2></div><div class="hint">Vul in &amp; kies — deadlines automatisch ▾</div></div>
    <div class="formbody" id="formBody">
      <div class="fld"><label>Projectnummer <span class="req">*</span></label><input id="f_pn" type="number" placeholder="bijv. 261453"></div>
      <div class="fld"><label>PD-nummer <span class="req">*</span></label><input id="f_pd" type="text" placeholder="PD123456"></div>
      <div class="fld"><label>Uitvoerdatum <span class="req">*</span></label><input id="f_uit" type="date"></div>
      <div class="fld"><label>Type werkplan <span class="req">*</span></label><select id="f_typ"><option value="">— kies —</option><option>UP</option><option>GO</option><option>DO</option></select></div>
      <div class="fld"><label>Plaats <span class="req">*</span></label><input id="f_plaats" type="text" placeholder="Spijkenisse"></div>
      <div class="fld wide"><label>Adres <span class="req">*</span></label><input id="f_adres" type="text" placeholder="Straat 1"></div>
      <div class="fld"><label>Onderbrekingsbrief <span class="req">*</span></label><select id="f_ob"><option value="">— kies —</option><option>ja</option><option>nee</option></select></div>
      <div class="fld wide"><label>Type werkzaamheden</label><input id="f_werk" type="text" placeholder="bijv. Verwijderen LS-kabel"></div>
      <div class="fld"><label>Status</label><select id="f_status"><option>Nog te doen</option><option>Maken werkplan</option><option>Aanvullen werkplan</option><option>Afgerond</option></select></div>
      <div class="formactions">
        <button class="btn btn-primary" onclick="save()">💾 Opslaan</button>
        <button class="btn btn-ghost" onclick="clearForm()">Wissen</button>
        <div class="deadinfo" id="deadPreview"></div>
      </div>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="toolbar">
    <div class="chips" id="chips"></div>
    <div style="display:flex;gap:8px;align-items:center">
      <input class="search" id="search" type="search" placeholder="🔍 zoek plaats / PD…" oninput="onSearch(this.value)">
      <div class="tools">
        <button class="btn btn-ghost" onclick="exportCSV()">⬇︎ CSV</button>
        <button class="btn btn-ghost" onclick="window.print()">🖨︎ Print</button>
        <button class="btn btn-ghost" onclick="backup()">⬆︎ Back-up</button>
        <button class="btn btn-ghost" onclick="document.getElementById('imp').click()">⬇︎ Herstel</button>
        <input id="imp" type="file" accept="application/json,.json" style="display:none" onchange="herstel(this.files[0])">
      </div>
    </div>
  </div>
  <div class="count" id="count" style="margin-bottom:8px"></div>

  <div id="tableWrap"></div>

  <footer>Werkplanning · gegevens lokaal bewaard in deze browser (localStorage) · gemaakt door Jarvis</footer>
</div>

<script>
const KEY='werkplanning_v2';
const SEED=[];
let DATA=load(), editId=null, view='actief', filter='alle', search='';
function load(){try{const s=localStorage.getItem(KEY)||localStorage.getItem('werkplanning_v1');return s?JSON.parse(s):SEED.slice();}catch(e){return SEED.slice();}}
function persist(){localStorage.setItem(KEY,JSON.stringify(DATA));}

const COL={red:'#ef4444',amber:'#f59e0b',yellow:'#eab308',green:'#22c55e'};
const OFF={UP:-10,GO:-7,DO:-1};
function d0(d){const x=new Date(d);x.setHours(0,0,0,0);return x;}
const TODAY=d0(new Date());
function iso(d){d=d0(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addWork(date,n){let d=d0(date),step=n<0?-1:1,c=0;while(c<Math.abs(n)){d.setDate(d.getDate()+step);const w=d.getDay();if(w!==0&&w!==6)c++;}return d;}
function workCount(a,b){a=d0(a);b=d0(b);if(b<a)return -workCount(b,a);let d=new Date(a),c=0;while(d<b){d.setDate(d.getDate()+1);const w=d.getDay();if(w!==0&&w!==6)c++;}return c;}
function fmt(d){if(!d)return'';d=d0(d);return String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear();}
function urg(r){if(r<0)return{k:'telaat',t:'Te laat',c:COL.red,e:'🔴'};if(r<=2)return{k:'kritiek',t:'Kritiek',c:COL.amber,e:'🟠'};if(r<=5)return{k:'week',t:'Deze week',c:COL.yellow,e:'🟡'};return{k:'ruim',t:'Ruim',c:COL.green,e:'🟢'};}
const ORD={telaat:0,kritiek:1,week:2,ruim:3};
function calc(it){const dlw=addWork(it.uit,OFF[it.typ]||-1);const dlo=it.ob==='ja'?addWork(it.uit,-15):null;const eerst=dlo&&dlo<dlw?dlo:dlw;const rest=workCount(TODAY,eerst);return{...it,done:it.status==='Afgerond',dlw,dlo,eerst,rest,u:urg(rest)};}

function toggleForm(){const b=document.getElementById('formBody');b.style.display=b.style.display==='none'?'grid':'none';}
function clearForm(){editId=null;['pn','pd','uit','plaats','adres','werk'].forEach(k=>document.getElementById('f_'+k).value='');document.getElementById('f_typ').value='';document.getElementById('f_ob').value='';document.getElementById('f_status').value='Nog te doen';document.getElementById('formTitle').textContent='➕ Nieuwe klus toevoegen';document.getElementById('deadPreview').textContent='';}
function save(){const g=k=>document.getElementById('f_'+k).value.trim();
  const it={pn:g('pn'),pd:g('pd'),uit:g('uit'),plaats:g('plaats'),adres:g('adres'),typ:g('typ'),ob:g('ob'),werk:g('werk'),status:document.getElementById('f_status').value};
  if(!it.pn||!it.pd||!it.uit||!it.plaats||!it.adres||!it.typ||!it.ob){alert('Vul de verplichte velden (*) in.');return;}
  if(it.pd.slice(0,2).toUpperCase()!=='PD'){alert('PD-nummer moet met "PD" beginnen.');return;}
  if(editId){const i=DATA.findIndex(x=>x.id===editId);const prev=DATA[i];DATA[i]={...prev,...it};
    if(it.status==='Afgerond'&&!DATA[i].afgerondOp)DATA[i].afgerondOp=iso(TODAY);
    if(it.status!=='Afgerond')delete DATA[i].afgerondOp;}
  else{it.id=Date.now();if(it.status==='Afgerond')it.afgerondOp=iso(TODAY);DATA.push(it);}
  persist();clearForm();render();}
function edit(id){const it=DATA.find(x=>x.id===id);editId=id;document.getElementById('formBody').style.display='grid';
  for(const k of ['pn','pd','uit','plaats','adres','werk'])document.getElementById('f_'+k).value=it[k]||'';
  document.getElementById('f_typ').value=it.typ;document.getElementById('f_ob').value=it.ob;document.getElementById('f_status').value=it.status;
  document.getElementById('formTitle').textContent='✏️ Klus bewerken — '+it.pd;window.scrollTo({top:document.querySelector('.formcard').offsetTop-20,behavior:'smooth'});}
function del(id){if(confirm('Deze klus verwijderen?')){DATA=DATA.filter(x=>x.id!==id);persist();render();}}
function done(id){const it=DATA.find(x=>x.id===id);it.status='Afgerond';it.afgerondOp=iso(TODAY);persist();render();}
function reopen(id){const it=DATA.find(x=>x.id===id);it.status='Nog te doen';delete it.afgerondOp;persist();render();}
function onSearch(v){search=v.toLowerCase();renderTable();}
['f_uit','f_typ','f_ob'].forEach(id=>document.addEventListener('input',e=>{if(e.target.id===id)preview();}));
function preview(){const uit=document.getElementById('f_uit').value,typ=document.getElementById('f_typ').value,ob=document.getElementById('f_ob').value;
  if(!uit||!typ){document.getElementById('deadPreview').textContent='';return;}
  const c=calc({uit,typ,ob,status:''});document.getElementById('deadPreview').innerHTML=`Eerstvolgende deadline: <b style="color:${c.u.c}">${fmt(c.eerst)}</b> · ${c.rest<0?c.rest:'+'+c.rest} werkdagen ${c.u.e}`;}
function setF(f){filter=f;renderTable();}
function setView(v){view=v;filter='alle';search='';document.getElementById('search').value='';render();}

const chips=[['alle','Alle'],['telaat','🔴 Te laat'],['kritiek','🟠 Kritiek'],['week','🟡 Deze week'],['ob','📨 Onderbrekingsbrief']];
function bars(el,items,color){const mx=Math.max(...items.map(i=>i[1]),1);document.getElementById(el).innerHTML=items.map(i=>`<div class="bar-row"><div class="lab">${i[0]}</div><div class="bar-track"><div class="bar-fill" style="width:${i[1]/mx*100}%;background:${color}"></div></div><div class="val">${i[1]}</div></div>`).join('');}

function render(){
  document.getElementById('today').textContent=TODAY.toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'long',year:'numeric'});
  const items=DATA.map(calc);
  const act=items.filter(d=>!d.done), don=items.filter(d=>d.done);
  const telaat=act.filter(d=>d.rest<0).length,kritiek=act.filter(d=>d.rest>=0&&d.rest<=2).length,week=act.filter(d=>d.rest>=0&&d.rest<=5).length,ob=act.filter(d=>d.ob==='ja').length;
  const kpis=[
    ['📦','#e0e7ff',act.length,'Open klussen','accent','alle'],
    ['🔴','#fee2e2',telaat,'Te laat','','telaat'],
    ['🟠','#ffedd5',kritiek,'Kritiek (≤2 wd)','','kritiek'],
    ['🟡','#fef9c3',week,'Deze week (≤5 wd)','','week'],
    ['📨','#e0e7ff',ob,'Onderbrekingsbrieven','','ob'],
    ['✅','#dcfce7',don.length,'Afgerond','','done']];
  document.getElementById('kpis').innerHTML=kpis.map(k=>`<div class="kpi ${k[4]}" onclick="kpiClick('${k[5]}')"><div class="ic" style="background:${k[1]}">${k[0]}</div><div class="n">${k[2]}</div><div class="l">${k[3]}</div></div>`).join('');
  const cnt=(arr,f,v)=>arr.filter(d=>d[f]===v).length;
  bars('byType',[['UP',cnt(act,'typ','UP')],['GO',cnt(act,'typ','GO')],['DO',cnt(act,'typ','DO')]],'linear-gradient(90deg,#6366f1,#818cf8)');
  bars('byStatus',[['Nog te doen',cnt(items,'status','Nog te doen')],['Maken WP',cnt(items,'status','Maken werkplan')],['Aanvullen WP',cnt(items,'status','Aanvullen werkplan')],['Afgerond',don.length]],'linear-gradient(90deg,#0ea5e9,#38bdf8)');
  document.getElementById('donutTot').textContent=act.length;
  const segs=[['Te laat',telaat,COL.red],['Kritiek',kritiek,COL.amber],['Deze week',week-kritiek,COL.yellow],['Ruim',act.filter(d=>d.rest>5).length,COL.green]];
  let off=25,svg='<circle cx="21" cy="21" r="15.915" fill="none" stroke="#eef2f7" stroke-width="6"/>';
  segs.forEach(s=>{if(s[1]>0&&act.length){const p=s[1]/act.length*100;svg+=`<circle cx="21" cy="21" r="15.915" fill="none" stroke="${s[2]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${off}"/>`;off-=p;}});
  document.getElementById('donut').innerHTML=svg;
  document.getElementById('legend').innerHTML=segs.map(s=>`<div><span class="dot" style="background:${s[2]}"></span>${s[0]} <b style="margin-left:4px">${s[1]}</b></div>`).join('');
  // tabs
  document.getElementById('tabs').innerHTML=
    `<div class="tab ${view==='actief'?'active':''}" onclick="setView('actief')">📋 Actief <span class="pill">${act.length}</span></div>`+
    `<div class="tab ${view==='afgerond'?'active':''}" onclick="setView('afgerond')">✅ Afgerond <span class="pill">${don.length}</span></div>`;
  document.getElementById('chips').style.display=view==='actief'?'flex':'none';
  document.getElementById('chips').innerHTML=chips.map(c=>`<div class="chip ${filter===c[0]?'active':''}" onclick="setF('${c[0]}')">${c[1]}</div>`).join('');
  renderTable();
}
function kpiClick(f){if(f==='done'){setView('done');}else{view='actief';filter=f;render();}}
function setView(v){view=v==='done'?'afgerond':v;if(v!=='done'){filter='alle';}search='';if(document.getElementById('search'))document.getElementById('search').value='';render();}

function renderTable(){
  const items=DATA.map(calc);
  const tw=document.getElementById('tableWrap');
  const matchS=d=>!search||[d.pd,d.plaats,d.adres,d.werk,String(d.pn)].join(' ').toLowerCase().includes(search);
  if(view==='afgerond'){
    let rows=items.filter(d=>d.done&&matchS(d)).sort((a,b)=>(b.afgerondOp||'').localeCompare(a.afgerondOp||''));
    document.getElementById('count').textContent=rows.length+' afgeronde klussen';
    tw.innerHTML=`<table><thead><tr><th>Project / PD</th><th>Locatie</th><th>Type</th><th>Uitvoer</th><th>Afgerond op</th><th>Werkzaamheden</th><th></th></tr></thead><tbody>`+
      (rows.length?rows.map(d=>{const bcl={UP:'b-up',GO:'b-go',DO:'b-do'}[d.typ]||'st';
        return `<tr class="done"><td><div class="pd">${d.pd}</div><div class="muted">#${d.pn}</div></td><td>${d.plaats}<div class="muted">${d.adres}</div></td><td><span class="badge ${bcl}">${d.typ}</span></td><td>${fmt(d.uit)}</td><td><span class="badge st-done">✅ ${fmt(d.afgerondOp)||'—'}</span></td><td class="muted" style="max-width:230px">${d.werk||''}</td><td><div class="act"><button class="iconbtn" onclick="reopen(${d.id})" title="heropenen">↩︎</button><button class="iconbtn" onclick="del(${d.id})" title="verwijderen">🗑️</button></div></td></tr>`;}).join(''):`<tr><td colspan="7" class="empty">Nog niets afgerond.</td></tr>`)+`</tbody></table>`;
    return;
  }
  let rows=items.filter(d=>!d.done&&matchS(d));
  if(filter==='ob')rows=rows.filter(d=>d.ob==='ja');else if(filter!=='alle')rows=rows.filter(d=>d.u.k===filter);
  rows.sort((a,b)=>ORD[a.u.k]-ORD[b.u.k]||a.rest-b.rest);
  const total=items.filter(d=>!d.done).length;
  document.getElementById('count').textContent=rows.length+' van '+total+' actieve klussen';
  tw.innerHTML=`<table><thead><tr><th>Project / PD</th><th>Locatie</th><th>Type</th><th>Uitvoer</th><th>Eerstvolgende deadline</th><th>Werkdagen</th><th>Urgentie</th><th>Status</th><th>Werkzaamheden</th><th></th></tr></thead><tbody>`+
    (rows.length?rows.map(d=>{const bcl={UP:'b-up',GO:'b-go',DO:'b-do'}[d.typ]||'st';
      return `<tr><td><div class="pd">${d.pd}</div><div class="muted">#${d.pn}</div></td><td>${d.plaats}<div class="muted">${d.adres}</div></td><td><span class="badge ${bcl}">${d.typ}</span></td><td>${fmt(d.uit)}</td><td>${fmt(d.eerst)} ${d.ob==='ja'?'<span title="onderbrekingsbrief">📨</span>':''}</td><td><span class="days" style="color:${d.u.c}">${d.rest<0?d.rest:'+'+d.rest}</span></td><td><span class="urg" style="color:${d.u.c}">${d.u.e} ${d.u.t}</span></td><td><span class="badge st">${d.status}</span></td><td class="muted" style="max-width:190px">${d.werk||''}</td><td><div class="act"><button class="iconbtn go" onclick="done(${d.id})" title="markeer afgerond">✓</button><button class="iconbtn" onclick="edit(${d.id})" title="bewerken">✏️</button><button class="iconbtn" onclick="del(${d.id})" title="verwijderen">🗑️</button></div></td></tr>`;}).join(''):`<tr><td colspan="10" class="empty">Geen klussen in deze weergave.</td></tr>`)+`</tbody></table>`;
}
function exportCSV(){const h=['Projectnummer','PD-nummer','Uitvoerdatum','Plaats','Adres','Type','Onderbrekingsbrief','Eerstvolgende deadline','Werkdagen resterend','Status','Afgerond op','Werkzaamheden'];
  const lines=[h.join(';')].concat(DATA.map(calc).map(d=>[d.pn,d.pd,fmt(d.uit),d.plaats,d.adres,d.typ,d.ob,fmt(d.eerst),d.done?'':d.rest,d.status,fmt(d.afgerondOp),(d.werk||'').replace(/;/g,',')].join(';')));
  const blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='werkplanning.csv';a.click();}
function backup(){const blob=new Blob([JSON.stringify(DATA,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='werkplanning-backup.json';a.click();}
function herstel(file){if(!file)return;const rd=new FileReader();rd.onload=e=>{try{const arr=JSON.parse(e.target.result);if(!Array.isArray(arr))throw 0;DATA=arr.map((d,i)=>({...d,id:d.id||Date.now()+i}));persist();render();alert('Hersteld: '+arr.length+' klussen ingeladen.');}catch(err){alert('Kon dit bestand niet lezen (geen geldige back-up).');}};rd.readAsText(file);}
clearForm();render();
</script>
